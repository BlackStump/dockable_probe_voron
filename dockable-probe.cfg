# Dockable Probe configuration
# Updated for current Klipper API
#
# NOTE: 'extract_position' is NOT a valid config key - it was listed in the
# old example .cfg but the Python module does not read it.  MOVE_TO_EXTRACT_PROBE
# simply re-uses approach_position, which is correct behaviour.
#
# Coordinates below are EXAMPLES from the original BlackStump config
# (bed origin at centre).  Replace with your actual dock coordinates.

[dockable_probe]
pin: ^Y_MIN                                 # ← required: your probe/endstop pin, e.g. ^PB7

# Dock geometry --------------------------------------------------------
# All positions are X, Y  (2-coord) unless your dock requires a Z move,
# in which case supply X, Y, Z  (3-coord).
dock_position:        44.5, 303        # centre of the dock magnet
approach_position:    44.5, 250        # approach vector (same X, offset Y)
detach_position:      100, 303        # move here to break the magnetic hold

# Probe offsets --------------------------------------------------------
x_offset:             0.0
y_offset:             18.0
z_offset:             0.0              # calibrate with PROBE_CALIBRATE

# Sampling -------------------------------------------------------------
sample_retract_dist:  5
samples:              3
samples_result:       median
samples_tolerance:    0.008
samples_tolerance_retries: 3

# Attachment verification ----------------------------------------------
# check_open_attach: True  → probe endstop is OPEN when probe is attached
# Set to False if your probe endstop is CLOSED (triggered) when attached.
check_open_attach:    True

# Dock behaviour -------------------------------------------------------
dock_retries:         3
auto_attach_detach:   True

# Speeds (mm/s) --------------------------------------------------------
speed:                3               # probing speed
lift_speed:           100
travel_speed:         60
attach_speed:         30
detach_speed:         50

# Optional: hop Z before moving to dock (set 0 to disable)
z_hop:                10.0

# Return to the position the toolhead was at before attaching after a
# detach cycle.  Set False to stay near the dock (saves travel on QGL).
return_to_last_probe_position_after_detach: False
